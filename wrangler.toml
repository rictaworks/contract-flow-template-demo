name = "contract-flow-template-demo"
main = "src/worker/index.ts"
compatibility_date = "2024-09-25"

[triggers]
# JST 03:00 = UTC 18:00 (前日)
crons = ["0 18 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "contract_flow_demo"
database_id = "8022e729-6c51-47d4-8245-85db765302b8"
migrations_dir = "src/worker/db/migrations"

[vars]
APP_ENV = "development"

[env.production]
[env.production.triggers]
crons = ["0 18 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "contract_flow_demo"
database_id = "8022e729-6c51-47d4-8245-85db765302b8"
migrations_dir = "src/worker/db/migrations"

[env.production.vars]
APP_ENV = "production"

# フロントエンド（Vite静的ビルド）をWorkers Assetsとして同じWorkerから配信する
# （rictaworks.jp / auth-link-triage-ledger-demo と同方式。Cloudflare Pagesは
# このAPIトークンにPages編集権限が無く使えないため採用）。
# /api/* のみWorkerスクリプト（Hono）を実行し、それ以外は静的アセットを直接返す。
[env.production.assets]
directory = "./dist/frontend"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[env.production.routes]]
pattern = "contract-flow-template-demo.rictaworks.jp"
custom_domain = true
